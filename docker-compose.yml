services:
  # Base descartable solo para los tests (ver `src/test/db.ts`, que hace
  # TRUNCATE entre corridas). Nunca apuntar `DATABASE_URL` acá.
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestion_test
    ports:
      - '5434:5432'
    volumes:
      - gestion_test_db:/var/lib/postgresql/data

volumes:
  gestion_test_db:
